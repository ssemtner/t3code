name: Fork release

# Builds the fork's t3 runtime archives (linux-x64, darwin-arm64) and the unsigned macOS arm64
# desktop app, then publishes them as release v<version> for scripts/install.sh, `t3 update`, the
# background service and server self-update. scripts/fork-release.sh holds the version scheme and
# build steps.

on:
  push:
    branches:
      - machines
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            install_args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...
            build_args: ""
          - label: darwin-arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
            install_args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
            build_args: --desktop
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ matrix.install_args }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache resource monitor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target
          key: fork-resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      # The archive and the staged desktop app install without a lockfile; a new week starts cold.
      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "key=fork-stage-pnpm-${{ matrix.label }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache staged install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.key }}

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install Linux archive tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libatomic1

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(scripts/fork-release.sh version "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
        run: scripts/fork-release.sh build "${{ steps.version.outputs.version }}" release-out ${{ matrix.build_args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-${{ matrix.label }}
          path: |
            release-out/t3-*.tar.gz
            release-out/*.dmg
            release-out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish release
    needs: build
    # A manual run on another branch only builds.
    if: github.ref_name == 'machines'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-release-*
          path: assets
          merge-multiple: true

      # gh uploads the assets to a draft and publishes it after, so no client sees a release
      # without its archives. Marked latest: the installer's stable lookup reads /releases/latest.
      - name: Publish
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz T3-Code-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "v$VERSION" t3-*.tar.gz T3-Code-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code $VERSION" \
            --notes "Fork build of ${GITHUB_SHA} from ${GITHUB_REF_NAME}." \
            --latest
